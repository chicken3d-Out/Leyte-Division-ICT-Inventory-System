<mat-toolbar class="toolbar">
        <div style="display: flex; column-gap: 10px; margin-left: 10px;">
            <img [src]="logoUrl" alt="" height="40" width="40">
            <span style="margin-left: 10px; color: whitesmoke; font-weight: 400; font-size: 1.2rem; display: flex; flex-direction: column; justify-content: center;"><div>Department of Education - Leyte Division ICT Inventory </div></span>
            
        </div>

</mat-toolbar>
<div class="login-wrapper">
  <mat-card class="login-card">
    <h2 class="title">Division ICT Inventory System</h2>

    <form (ngSubmit)="login()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" name="username" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required>
      </mat-form-field>

      <button style="background-color: #006837; color: whitesmoke;" mat-raised-button color="primary" type="submit" class="full-width">
        Login
      </button>
    </form>
  </mat-card>
</div>
