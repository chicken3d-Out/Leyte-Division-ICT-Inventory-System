<mat-drawer-container class="main-container">
    <mat-drawer class="sidenav" #drawer mode="side">
        <div class="side-content">
            <div class="contentHeader">
                <div class="bar"></div>
                <div class="header">
                    <div style="display:flex; gap:7px;">
                        <div style="color:#20784f;"><mat-icon>inventory</mat-icon></div>
                        <div>Division ICT Inventory System</div>
                    </div>
                </div>
            </div>
            <a class="content" routerLink="/statistics" routerLinkActive="active-section">
                <div class="icon-section">
                    <div><mat-icon>analytics</mat-icon></div>
                    <div>Statistics</div>
                </div> 
            </a>
            <a class="content" routerLink="/inventory" routerLinkActive="active-section">
                <div class="icon-section">
                    <div><mat-icon>warehouse</mat-icon></div>
                    <div>Inventory</div>
                </div>
            </a>
            <a class="content" routerLink="/intercon" routerLinkActive="active-section">
                <div class="icon-section">
                    <div><mat-icon>wifi</mat-icon></div>
                    <div>Internet Connectivity</div>
                </div>
            </a>
            <a class="content" routerLink="/profile" routerLinkActive="active-section">
                <div class="icon-section">
                    <div><mat-icon>badge</mat-icon></div>
                    <div>School Profile</div>
                </div>
            </a>
        </div>
    </mat-drawer>
    <mat-toolbar class="toolbar">
        <div style="display: flex; column-gap: 10px;">
            <button type="button" mat-button (click)="drawer.toggle()">
                <mat-icon class="ham">view_headline</mat-icon>
            </button>
            <img [src]="logoUrl" alt="" height="40" width="40">
            <span style="font-weight: 400; font-size: 1.2rem; display: flex; flex-direction: column; justify-content: center;"><div>Leyte -  Division ICT Inventory System </div></span>
            
        </div>
        <div>

        </div>
        <div class="user-icon">
            <div style="display: flex;">
                <div style="font-size: .9rem; display: flex; place-items: center; color: whitesmoke; font-weight: 400;">{{schoolName}}</div>
                <button (click)="update()" mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                <mat-icon style="color: black;">account_circle</mat-icon>
                </button>
            </div>
            <mat-menu #menu="matMenu">
                <mat-card style="margin: 0px 8px;" class="example-card" appearance="outlined">
                    <mat-card-header>
                    <div mat-card-avatar class="example-header-image"></div>
                        <img style="border-radius: 50%; border: 3px solid #ccc; background-size: cover; background-position: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);" [src]="previewUrl" alt="School Logo" width="55" height="55"/><br>
                        <mat-card-header>{{schoolName}}</mat-card-header>
                    </mat-card-header>
                        <mat-card-title style="display: flex; justify-content: center; font-weight: bold; font-size: 1rem;">School ID: {{schoolID}}</mat-card-title>

                        <button (click)="onSignOut()" style="background-color:rgb(11, 66, 124); color:whitesmoke; margin-top: 5px; font-family: Arial Narrow; font-weight: bold; padding: 5px; font-size: 1rem; cursor: pointer;">Sign Out 😧</button>
                </mat-card>
                
            </mat-menu>
        </div>

    </mat-toolbar>
    <div class="contents">
        <router-outlet></router-outlet>
    </div>
</mat-drawer-container>
