<mat-card appearance="outlined">
    <div style="display: flex; justify-content: center; margin: 20px 5px 0px 5px; font-weight: bold; font-size: 1rem;">Confirm Save</div>
    <mat-dialog-content>
    <p>Are you sure you want to save? This will override your previous data.</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
    <button style="color: black;" matButton="outlined" (click)="onCancel()">No</button>
    <button matButton="outlined" style="background-color: #006837; color: whitesmoke;" (click)="onConfirm()">Yes</button>
    </mat-dialog-actions>
</mat-card>
